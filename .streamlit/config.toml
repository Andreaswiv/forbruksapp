[browser]
# Ingen bruksstatistikk sendes til Streamlit/Snowflake
gatherUsageStats = false

[server]
# Kun tilgjengelig fra denne maskinen
address = "localhost"
headless = true

[theme]
base = "light"
primaryColor = "#6d5dfc"
backgroundColor = "#f6f6fb"
secondaryBackgroundColor = "#efedff"
textColor = "#1d1b3a"
borderColor = "#e6e4f2"
baseRadius = "large"

[client]
toolbarMode = "minimal"
