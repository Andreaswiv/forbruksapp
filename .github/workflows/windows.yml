# Bygger «Pengene mine» for Windows og lager PengeneMine-installer.exe.
# - Kjører av seg selv på pull requests som endrer appen (filen havner under «Artifacts»)
# - Kjør for hånd: Actions → Windows-installer → Run workflow
# - Push en tag som v1.0.0: filen legges også ut som en nedlastbar «Release»
name: Windows-installer

on:
  workflow_dispatch:
  pull_request:
    paths: ["app.py", "launcher.py", "forbruk/**", "windows/**", ".github/workflows/windows.yml"]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bygg programmappen (Python + appen)
        shell: pwsh
        run: ./windows/build.ps1

      - name: Test at appen virker på Windows
        shell: pwsh
        run: build\PengeneMine\python\python.exe -X utf8 windows\smoketest.py

      - name: Lag installasjonsfilen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { Write-Host "::error title=Inno Setup mangler::Fant ikke $iscc"; exit 1 }
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          $out = & $iscc "/DAppVersion=$v" windows\installer.iss 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out -split "`n") | Select-Object -Last 30) -join "%0A"
            Write-Host "::error title=Inno Setup feilet::$tail"
            exit 1
          }
          Get-Item build\PengeneMine-installer.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PengeneMine-installer
          path: build/PengeneMine-installer.exe

      - name: Legg ut som Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PengeneMine-installer.exe
